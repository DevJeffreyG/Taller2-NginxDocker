services:
  api:
    build: .
    environment:
      PORT: 3000
    expose:
      - "3000"
  redis:
    build: .
    environment:
      PORT: 4000
    expose:
      - "4000"
  nginx:
    image: nginx:latest
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
    depends_on:
      - api
      - redis
